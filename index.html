<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3522">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Al Maidan Directory</title>
<style>
:root{--emerald:#0f3522;--ink:#14261D;--paper:#F2F5F3;--card:#fff;--rose:#C48C80;--rose-d:#8A5547;--line:#D3DDD8;--mute:#55695F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--emerald) url('banner.jpeg') center/cover no-repeat;border-bottom:2px solid var(--rose);color:#F2F5F3;padding:calc(14px + env(safe-area-inset-top)) 0 16px;text-align:center}
header img{display:block;margin:0 auto;height:112px;width:auto}
header p{margin:2px 0 12px;color:#C9B1A8;font-size:.9rem}
.langbar{display:flex;justify-content:flex-end;margin-bottom:8px;direction:ltr}
.seg{display:inline-flex;border:1px solid #5A7A6A;border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#E7EEEA;border:0;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer;min-width:56px}
.seg button[aria-pressed=true]{background:var(--rose);color:#14261D}
.cta{display:grid;grid-template-columns:1fr;gap:10px}
.cta a{display:block;padding:13px 10px;border-radius:12px;font-weight:700;text-decoration:none;font-size:1rem}
.cta .list{border:2px solid var(--rose);background:var(--rose);color:#14261D}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected=true]{background:var(--emerald);border-color:var(--emerald);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}
.filters input,#focus{grid-column:1/-1}
.filters input,.filters select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
main{padding-top:14px;padding-bottom:8px}
.count{color:var(--mute);margin:0 0 10px;font-size:.9rem}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--emerald);border-radius:12px;padding:14px}
.card.star{border-inline-start-color:var(--rose)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card h2{margin:0;font-size:1.1rem;line-height:1.25}
.sub{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chip{background:#E3EBE6;color:var(--emerald);border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:600}
.chip.alt{background:#F5E8E3;color:var(--rose-d)}
.tag{background:var(--rose);color:#14261D;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700}
.loc{margin:0;color:var(--mute);font-size:.9rem}
.notes{margin:8px 0 0;font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.notes.open{-webkit-line-clamp:unset;display:block}
.more{background:none;border:0;color:var(--rose-d);font:inherit;font-size:.88rem;padding:4px 0;cursor:pointer;text-decoration:underline}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;padding:11px 10px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid var(--emerald);color:var(--emerald);background:#fff}
.btn.wa{background:var(--emerald);color:#fff}
.nonum{color:var(--mute);font-size:.9rem;margin:12px 0 0}
.empty,#msg{padding:28px 8px;text-align:center;color:var(--mute)}
.empty a{display:inline-block;margin-top:8px;color:var(--rose-d);font-weight:700}
footer{background:var(--emerald);color:#E7EEEA;margin-top:24px;padding:22px 0 calc(22px + env(safe-area-inset-bottom));text-align:center}
footer h3{margin:0 0 4px;font-size:1rem}
footer p{margin:0 0 12px;color:#B9CDC2;font-size:.9rem}
.admins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.admins a{display:block;border:1px solid #5A7A6A;border-radius:12px;padding:10px 8px;color:#fff;text-decoration:none;font-weight:600}
.admins small{display:block;color:#B9CDC2;font-weight:400}
footer .sheet{color:#fff;font-weight:600}
dialog{border:0;border-radius:14px;padding:20px;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,42,30,.75)}
dialog h2{margin:0 0 6px}
dialog input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:10px 0}
dialog button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--emerald);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{color:#9B2C2C;font-size:.9rem;margin:0}
html[dir=rtl] .card .sub,html[dir=rtl] .card .loc,html[dir=rtl] .card .notes,html[dir=rtl] .card .nonum{text-align:right}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="langbar"><div class="seg" role="group" aria-label="Language">
      <button type="button" id="lEN" data-lang="en">EN</button>
      <button type="button" id="lAR" data-lang="ar">عربي</button>
    </div></div>
    <img src="logo.png" alt="Al Maidan" width="149" height="112">
    <p data-i18n="tagline">UAE events and production field directory</p>
    <div class="cta" id="cta"></div>
  </div>
</header>
<div class="bar">
  <div class="wrap">
    <nav id="tabs" role="tablist" data-aria="ariaTabs" aria-label="Categories"></nav>
    <div class="filters">
      <input id="q" type="search" data-ph="searchPh" data-aria="ariaSearch" placeholder="Search name, service or city" aria-label="Search">
      <select id="dept" data-aria="ariaDept" aria-label="Department"></select>
      <select id="spec" data-aria="ariaRole" aria-label="Role"></select>
      <select id="focus" data-aria="ariaInd" aria-label="Industry">
        <option value="all" data-i18n="allInd">All industries</option>
        <option value="film" data-i18n="film">Film and media</option>
        <option value="live" data-i18n="events">Events</option>
      </select>
    </div>
  </div>
</div>
<main class="wrap">
  <p id="msg"></p>
  <p class="count" id="count" hidden></p>
  <div class="grid" id="list"></div>
</main>
<footer>
  <div class="wrap">
    <h3 data-i18n="helpTitle">Need help? Message an admin</h3>
    <p data-i18n="helpSub">Questions, corrections or listing requests</p>
    <div class="admins" id="admins"></div>
    <a class="sheet" id="sheet" target="_blank" rel="noopener" data-i18n="sheet">View the full directory sheet</a>
  </div>
</footer>
<dialog id="gate">
  <h2 data-i18n="gateTitle">Members only</h2>
  <p data-i18n="gateText">Enter the access code from the Al Maidan WhatsApp group.</p>
  <p class="err" id="gateErr"></p>
  <input id="code" type="password" autocomplete="off" data-ph="codePh" data-aria="codePh" placeholder="Access code" aria-label="Access code">
  <button id="go" data-i18n="open">Open directory</button>
</dialog>

const AR_RE = /[\u0600-\u06FF]/;
const norm = s => String(s||"").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي")
  .replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase().trim();
const stripAl = w => (w.length>3 && w.startsWith("ال")) ? w.slice(2) : w;
const STOP = new Set(["في","من","الي","علي","مع","عن","او","و","ال","هل","كل"].map(norm));

const REV = {}, IDX = [];
(function build(){
  const add = (en, list) => {
    const set = new Set();
    list.forEach(a => { const n = norm(a); set.add(n); set.add(n.split(" ").map(stripAl).join(" ")); });
    IDX.push({en, ar:[...set]});
  };
  [DEPT_AR, ROLE_AR, FOCUS_AR].forEach(m => Object.keys(m).forEach(en => {
    REV[norm(m[en])] = en;
    add(en, [m[en]].concat(ALIASES[en] || []));
  }));
  Object.keys(LOC_AR).forEach(en => add(en, LOC_AR[en]));
})();
const toEn = v => (v && AR_RE.test(v)) ? (REV[norm(v)] || v) : v;

function arNeedles(raw){
  const tk = stripAl(norm(raw));
  if(tk.length < 2 || STOP.has(tk)) return [];
  const out = new Set();
  IDX.forEach(e => { if(e.ar.some(p => p.includes(tk))) out.add(e.en.toLowerCase()); });
  return [...out];
}
function qMatch(q, hay){
  if(!q) return true;
  if(!AR_RE.test(q)) return hay.includes(q.toLowerCase());
  return q.split(/[\s،,؛;]+/).filter(Boolean).every(tk => {
    if(!AR_RE.test(tk)) return hay.includes(tk.toLowerCase());
    const needles = arNeedles(tk);
    return needles.length ? needles.some(n => hay.includes(n)) : false;
  });
}

let lang = localStorage.getItem("am_lang") ||
  ((navigator.language||"").toLowerCase().startsWith("ar") ? "ar" : "en");
const t = k => (UI[lang][k] != null ? UI[lang][k] : UI.en[k]);
const tr = (map, en) => (lang === "ar" && map[en]) ? map[en] : en;

const $ = s => document.querySelector(s);
let DATA = null, cur = 0, STRUCT = [], msgKey = "loading", gateKey = "";

function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function link(cls, text, href){const a=el("a",cls,text);a.href=href;a.target="_blank";a.rel="noopener";return a}

function waNumber(p){
  const first=(p||"").split(/[\/,;]|\bor\b/i)[0];
  let d=first.replace(/\D/g,"");
  if(!d)return "";
  if(d.startsWith("00"))d=d.slice(2);
  else if(d.startsWith("0"))d="971"+d.slice(1);
  else if(d.length===9)d="971"+d;
  return d;
}

function showMsg(){
  const m=$("#msg");
  if(!msgKey){m.hidden=true;return}
  m.hidden=false;m.textContent=t(msgKey);
}

function applyStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  document.querySelectorAll("[data-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.aria)));
  $("#gateErr").textContent = gateKey ? t(gateKey) : "";
  $("#lEN").setAttribute("aria-pressed", lang === "en");
  $("#lAR").setAttribute("aria-pressed", lang === "ar");
  showMsg();
}

function setLang(l){
  lang = l;
  localStorage.setItem("am_lang", l);
  applyStatic();
  if(DATA){ chrome(); buildNav(); fillDept(true); render(); }
}
$("#lEN").onclick = () => setLang("en");
$("#lAR").onclick = () => setLang("ar");

async function load(){
  const code=localStorage.getItem("am_code")||"";
  try{
    const r=await fetch(API_URL+"?code="+encodeURIComponent(code));
    const j=await r.json();
    if(j.error){ask(code?"wrong":"");return}
    localStorage.setItem("am_data",JSON.stringify(j));
    DATA=j;msgKey="";start();
  }catch(e){
    const c=localStorage.getItem("am_data");
    if(c){DATA=JSON.parse(c);msgKey="offline";start()}
    else{msgKey="failed";showMsg()}
  }
}

function ask(key){
  gateKey=key;$("#gateErr").textContent=key?t(key):"";
  const g=$("#gate");if(!g.open)g.showModal();
}
$("#go").onclick=()=>{
  localStorage.setItem("am_code",$("#code").value.trim());
  $("#gate").close();load();
};
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});

function chrome(){
  const cta=$("#cta");cta.textContent="";
  cta.append(link("list",t("list"),FORM_URL));
  const ad=$("#admins");ad.textContent="";
  ADMINS.forEach(a=>{
    const n=waNumber(a.phone);
    const x=link("",a.name,"https://wa.me/"+n);
    const s=el("small","",a.phone);s.dir="ltr";x.append(s);ad.append(x);
  });
  $("#sheet").href=SHEET_URL;
}

function buildStruct(){
  const tab=DATA.tabs[cur];
  const out=(tab.departments||[]).map(d=>({name:d.name,roles:d.roles.slice()}));
  tab.rows.forEach(r=>{
    if(!r.dept)return;
    let d=out.find(x=>x.name===r.dept);
    if(!d){d={name:r.dept,roles:[]};out.push(d)}
    if(r.role&&!d.roles.includes(r.role))d.roles.push(r.role);
  });
  STRUCT=out;
}
const countRows=(fn)=>DATA.tabs[cur].rows.filter(fn).length;
const label=(name,n)=>n?name+" ("+n+")":name;

function buildNav(){
  const nav=$("#tabs");nav.textContent="";
  DATA.tabs.forEach((tb,i)=>{
    const b=el("button","",tr(TAB_AR,tb.name));b.setAttribute("role","tab");b.setAttribute("aria-selected",i===cur);
    b.onclick=()=>{cur=i;[...nav.children].forEach((c,k)=>c.setAttribute("aria-selected",k===i));pickTab()};
    nav.append(b);
  });
}
function start(){
  showMsg();chrome();buildNav();pickTab();
}
function pickTab(){buildStruct();fillDept(false);render()}

function setIfExists(sel,val){if(val&&[...sel.options].some(o=>o.value===val))sel.value=val}
function fillDept(keep){
  const d=$("#dept"),prev=keep?d.value:"";d.textContent="";
  d.append(new Option(t("allDepts"),""));
  STRUCT.forEach(x=>d.append(new Option(label(tr(DEPT_AR,x.name),countRows(r=>r.dept===x.name)),x.name)));
  setIfExists(d,prev);
  fillRole(keep);
}
function fillRole(keep){
  const s=$("#spec"),prev=keep?s.value:"",dp=toEn($("#dept").value);s.textContent="";
  s.append(new Option(dp?t("allRolesIn")+tr(DEPT_AR,dp):t("allRoles"),""));
  const add=(parent,d,role)=>parent.append(new Option(label(tr(ROLE_AR,role),countRows(r=>r.dept===d.name&&r.role===role)),role));
  if(dp){
    const d=STRUCT.find(x=>x.name===dp);
    if(d)d.roles.forEach(r=>add(s,d,r));
  }else{
    STRUCT.forEach(d=>{
      if(!d.roles.length)return;
      const g=document.createElement("optgroup");g.label=tr(DEPT_AR,d.name);
      d.roles.forEach(r=>add(g,d,r));
      s.append(g);
    });
  }
  setIfExists(s,prev);
}

function headline(r){
  const comp=(r.company||"").trim(),person=(r.person||"").trim();
  const realCo=comp&&!/^freelance\b/i.test(comp);
  const tagData=(r.entity||"").trim();
  let mappedTag = "";
  if(tagData.toLowerCase().includes("company")) mappedTag = t("company");
  if(tagData.toLowerCase().includes("freelancer")) mappedTag = t("freelancer");
  
  if(realCo && person) return {head:comp,sub:person,tag:mappedTag};
  if(realCo && !person) return {head:comp,sub:"",tag:mappedTag};
  if(!realCo && person) return {head:person,sub:"",tag:mappedTag};
  return {head:person||comp||t("unnamed"),sub:"",tag:mappedTag};
}

function countText(n){
  if(lang==="ar"){
    if(n===0)return "لا توجد نتائج";
    if(n===1)return "نتيجة واحدة";
    if(n===2)return "نتيجتان";
    return n+(n<=10?" نتائج":" نتيجة");
  }
  return n+(n===1?" listing":" listings");
}

function render(){
  const q=$("#q").value.trim(),dp=toEn($("#dept").value),sp=toEn($("#spec").value),fo=$("#focus").value;
  const tab=DATA.tabs[cur];
  const rows=tab.rows.filter(r=>{
    if(dp&&r.dept!==dp)return false;
    if(sp&&r.role!==sp)return false;
    const f=(r.focus||"").toLowerCase();
    if(fo==="film"&&f&&!/media|film|all/.test(f))return false;
    if(fo==="live"&&f&&!/event|all/.test(f))return false;
    const hay=[r.company,r.person,r.role,r.dept,r.service,r.notes,r.location,r.focus].join(" ").toLowerCase();
    return qMatch(q,hay);
  });
  const list=$("#list");list.textContent="";
  const c=$("#count");c.hidden=false;c.textContent=countText(rows.length);
  if(!rows.length){
    const e=el("div","empty",t("empty"));
    e.append(el("br"),link("",t("list"),FORM_URL));
    list.append(e);return;
  }
  rows.forEach(r=>{
    const card=el("article","card"+(r.star?" star":""));
    const h=headline(r);
    const top=el("div","head");
    const t1=el("h2","",h.head);t1.dir="auto";top.append(t1);
    if(h.tag)top.append(el("span","tag",h.tag));
    card.append(top);
    if(h.sub){const p=el("p","sub",h.sub);p.dir="auto";card.append(p)}
    const chips=el("div","chips");
    if(r.role)chips.append(el("span","chip",tr(ROLE_AR,r.role)));
    if(r.focus)chips.append(el("span","chip alt",tr(FOCUS_AR,r.focus)));
    card.append(chips);
    if(r.location){const l=el("p","loc",r.location);l.dir="auto";card.append(l)}
    const text=r.notes||r.service;
    if(text){
      const n=el("p","notes",text);n.dir="auto";card.append(n);
      if(text.length>140){const m=el("button","more",t("more"));m.onclick=()=>{const o=n.classList.toggle("open");m.textContent=o?t("less"):t("more")};card.append(m)}
    }
    const num=waNumber(r.phone);
    if(num){
      const a=el("div","acts");
      const w=el("a","btn wa",t("wa"));w.href="https://wa.me/"+num;w.target="_blank";w.rel="noopener";
      const tl=el("a","btn",t("call"));tl.href="tel:+"+num;
      a.append(w,tl);card.append(a);
    }else card.append(el("p","nonum",t("nonum")));
    list.append(card);
  });
}

$("#q").oninput=render;
$("#dept").onchange=()=>{fillRole(false);render()};
$("#spec").onchange=render;$("#focus").onchange=render;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyStatic();
load();
</script>
</body>
</html>
